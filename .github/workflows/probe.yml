name: probe
on:
  push:
    branches:
      - ios13/ui-glass
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-13, macos-14, macos-15, macos-15-intel, macos-latest]
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    steps:
      - run: sw_vers && xcodebuild -version
