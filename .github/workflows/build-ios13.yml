name: Build iOS 13.4 IPA

on:
  push:
    branches:
      - ios13/ui-glass
    tags:
      - 'v*-ios13'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    env:
      EXPO_NO_TELEMETRY: '1'
      CI: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode (prefer 16.2, the image the 1.2.0 release was built with)
        run: |
          APP=""
          for v in 16.2 16.1 16.0; do
            if [ -d "/Applications/Xcode_${v}.app" ]; then APP="/Applications/Xcode_${v}.app"; break; fi
          done
          if [ -z "$APP" ]; then APP="$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"; fi
          echo "Using ${APP}"
          sudo xcode-select -s "${APP}/Contents/Developer"
          xcodebuild -version

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: yarn install --non-interactive

      - name: Prebuild iOS project (Expo SDK 50)
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Apply patches
        run: npx patch-package

      - name: Force deployment target to 13.4
        run: |
          node -e "
          const fs = require('fs');
          const p = 'ios/Podfile.properties.json';
          const props = fs.existsSync(p) ? JSON.parse(fs.readFileSync(p, 'utf8')) : {};
          props['ios.deploymentTarget'] = '13.4';
          props['newArchEnabled'] = 'false';
          fs.writeFileSync(p, JSON.stringify(props, null, 2));
          "

          perl -0pi -e "s/^platform :ios,.*\$/platform :ios, '13.4'/m" ios/Podfile

          find ios -name project.pbxproj -print0 | xargs -0 perl -pi -e 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]+;/IPHONEOS_DEPLOYMENT_TARGET = 13.4;/g'

          echo '--- Podfile ---'
          grep -n "platform :ios" ios/Podfile
          echo '--- targets pinned to 13.4 ---'
          find ios -name project.pbxproj -exec grep -c 'IPHONEOS_DEPLOYMENT_TARGET = 13.4' {} \;

      - name: Install CocoaPods
        run: |
          cd ios && pod install --repo-update

      - name: Build unsigned .app
        run: |
          WORKSPACE="$(ls -d ios/*.xcworkspace | head -1)"
          SCHEME="$(basename "${WORKSPACE}" .xcworkspace)"
          echo "workspace=${WORKSPACE} scheme=${SCHEME}"
          rm -rf ios/build
          xcodebuild -workspace "${WORKSPACE}" \
            -scheme "${SCHEME}" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build

      - name: Verify bundle contents
        run: |
          APP="$(ls -d ios/build/Build/Products/Release-iphoneos/*.app | head -1)"
          echo "app=${APP}"
          test -s "${APP}/main.jsbundle"
          MINOS="$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "${APP}/Info.plist")"
          echo "MinimumOSVersion=${MINOS}"
          test "${MINOS}" = "13.4"
          echo "APP_PATH=${APP}" >> "$GITHUB_ENV"

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r "${APP_PATH}" Payload/
          zip -qry CyMusic-ios13.4-unsigned.ipa Payload/

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: CyMusic-ios13.4-unsigned-ipa
          path: CyMusic-ios13.4-unsigned.ipa
          if-no-files-found: error
