name: Build Legacy IPA (iOS 13.4+)

on:
  push:
    tags: ['legacy*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    env:
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: legacy-120

      - uses: actions/setup-node@v4
        with:
          node-version: 18.20.4
          cache: yarn

      - name: Verify build tools
        run: |
          xcodebuild -version
          node --version
          yarn --version

      - name: Install pinned CocoaPods
        run: |
          gem install cocoapods --version 1.15.2 --no-document --user-install
          echo "$(ruby -e 'puts Gem.user_dir')/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: yarn install --non-interactive

      - name: Install Pods
        working-directory: ios
        run: pod install

      - name: Detect Xcode project
        id: proj
        working-directory: ios
        run: |
          if [ -d "CyMusic.xcworkspace" ]; then
            echo "workspace=CyMusic.xcworkspace" >> "$GITHUB_OUTPUT"
            echo "scheme=CyMusic" >> "$GITHUB_OUTPUT"
          elif [ -d "musicplayer.xcodeproj" ]; then
            echo "workspace=musicplayer.xcodeproj" >> "$GITHUB_OUTPUT"
            SCHEME=$(xcodebuild -list -project musicplayer.xcodeproj 2>/dev/null | awk '/Schemes:/{getline; print $1; exit}')
            echo "scheme=${SCHEME:-musicplayer}" >> "$GITHUB_OUTPUT"
          else
            echo "No known Xcode project found" && exit 1
          fi

      - name: Build unsigned .app
        working-directory: ios
        run: |
          xcodebuild -project "${{ steps.proj.outputs.workspace }}" \
            -scheme "${{ steps.proj.outputs.scheme }}" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: Install ldid
        run: brew install ldid || true

      - name: Package IPA and TIPA
        run: |
          APP_PATH=$(find ios/build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          test -n "$APP_PATH" || { echo 'No .app produced'; exit 1; }
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r CyMusic-legacy-unsigned.ipa Payload/
          if command -v ldid >/dev/null 2>&1; then
            APPBIN=$(basename "$APP_PATH" .app)
            if [ -f "Payload/$APPBIN/$APPBIN" ]; then
              ldid -S "Payload/$APPBIN/$APPBIN"
            fi
            if [ -d "Payload/$APPBIN/PlugIns" ]; then
              find "Payload/$APPBIN/PlugIns" -name '*.appex' -type d | while read appex; do
                bin=$(basename "$appex" .appex)
                [ -f "$(dirname "$appex")/$bin" ] && ldid -S "$(dirname "$appex")/$bin"
              done
            fi
          fi
          rm -f CyMusic-legacy.tipa
          zip -r CyMusic-legacy.tipa Payload/

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: CyMusic-legacy-unsigned-ipa
          path: CyMusic-legacy-unsigned.ipa

      - name: Upload TrollStore tipa
        uses: actions/upload-artifact@v4
        with:
          name: CyMusic-legacy-tipa
          path: CyMusic-legacy.tipa

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: legacy-1.2.0-isle
          name: Cymusictwo legacy 1.2.0 + 屿声移植（iOS 13.4+）
          body: |
            基于上游 1.2.0（Expo 50，deployment target 13.4），移植屿声三项改动：
            - 新增「我的」tab（用户区/金边会员卡/导入歌单/六分区行）
            - 收藏 tab 移入「我的」，收藏列表网格化
            - 设置弹窗重排版（功能逻辑不变）
            iOS 13.4+ 可运行，兼容 iOS 15.4。
          files: |
            CyMusic-legacy-unsigned.ipa
            CyMusic-legacy.tipa
