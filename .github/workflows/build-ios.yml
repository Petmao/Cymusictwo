name: Build iOS IPA

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      EXPO_NO_TELEMETRY: '1'
      RCT_NEW_ARCH_ENABLED: '1'
      RCT_HERMES_V1_ENABLED: '1'
    steps:
      - uses: actions/checkout@v4

      # Cache Yarn downloads only; node_modules, Pods and DerivedData stay fresh.
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Verify build tools
        run: |
          xcodebuild -version
          test "$(node --version)" = "v24.19.0"
          test "$(yarn --version)" = "1.22.22"
          echo "NODE_BINARY=$(command -v node)" >> "$GITHUB_ENV"

      - name: Install pinned CocoaPods
        run: |
          gem install cocoapods --version 1.16.2 --no-document --user-install
          echo "$(ruby -e 'puts Gem.user_dir')/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: Install locked Pods
        working-directory: ios
        run: |
          # Installed Pods carry configuration state; see README for local recovery.
          test ! -e Pods
          pod _1.16.2_ install --deployment

      - name: Build unsigned .app
        run: |
          xcodebuild -workspace ios/CyMusic.xcworkspace \
            -scheme CyMusic \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: Verify retained native resources
        run: |
          test -s ios/build/Build/Products/Release-iphoneos/CyMusic.app/main.jsbundle
          test -s ios/build/Build/Products/Release-iphoneos/CyMusic.app/user-api-preload.js
          test -d ios/build/Build/Products/Release-iphoneos/CyMusic.app/PlugIns/ShareExtension.appex

      - name: Install ldid
        run: brew install ldid || true

      - name: Package IPA and TIPA
        run: |
          mkdir -p Payload
          cp -r ios/build/Build/Products/Release-iphoneos/CyMusic.app Payload/
          zip -r CyMusic-unsigned.ipa Payload/
          # TrollStore tipa：对主二进制与插件做 ldid 伪签
          if command -v ldid >/dev/null 2>&1; then
            ldid -S Payload/CyMusic.app/CyMusic
            if [ -d Payload/CyMusic.app/PlugIns/ShareExtension.appex ]; then
              ldid -S Payload/CyMusic.app/PlugIns/ShareExtension.appex/ShareExtension
            fi
          fi
          rm -f CyMusic.tipa
          zip -r CyMusic.tipa Payload/

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: CyMusic-unsigned-ipa
          path: CyMusic-unsigned.ipa

      - name: Upload TrollStore tipa
        uses: actions/upload-artifact@v4
        with:
          name: CyMusic-tipa
          path: CyMusic.tipa

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.3-cymusictwo
          name: Cymusictwo v1.0.3（我的页 + 收藏迁移 + 设置重排版）
          body: |
            - 新增「我的」tab：用户区 / 金边会员卡 / 四平台导入歌单 / 六分区行
            - 收藏 tab 移入「我的 → 收藏与歌单」，收藏列表重做为屿声风格网格封面卡
            - 设置弹窗重排版（功能逻辑不变），音乐 tab 右上角菜单移除，入口收进设置中心
          files: |
            CyMusic-unsigned.ipa
            CyMusic.tipa
